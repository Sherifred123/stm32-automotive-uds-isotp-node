name: C/C++ CI Test Suite & ARM Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Toolchains
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make gcc-arm-none-eabi libnewlib-arm-none-eabi python3

    - name: Build Host Diagnostic Demo
      run: |
        make host

    - name: Execute Unity Unit Test Suite
      run: |
        make test

    - name: Run Python Diagnostic Client Tests
      run: |
        python3 tools/uds_tester.py

    - name: Validate Cross-Compilation for Cortex-M4
      run: |
        make arm
